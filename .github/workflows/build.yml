name: Build and Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # 显式缓存 NuGet 包目录：不依赖 setup-dotnet 的缓存后置步骤（它失败会让整个构建判负）
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore arknights-random-team.sln

      - name: Build
        run: dotnet build arknights-random-team.sln --configuration Release --no-restore

  publish:
    name: Publish ${{ matrix.rid }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # 显式缓存 NuGet 包目录：不依赖 setup-dotnet 的缓存后置步骤（它失败会让整个构建判负）
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore for ${{ matrix.rid }}
        run: dotnet restore desktop/arknights-random-team.Desktop.csproj --runtime ${{ matrix.rid }}

      - name: Publish ${{ matrix.rid }}
        run: >-
          dotnet publish desktop/arknights-random-team.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          --output publish/${{ matrix.rid }}

      - name: Package Windows artifact
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "arknights-random-team-${{ matrix.rid }}.zip"

      - name: Package Unix artifact
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: tar -czf arknights-random-team-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .

      - name: Upload Windows artifact
        if: startsWith(matrix.rid, 'win-')
        uses: actions/upload-artifact@v4
        with:
          name: arknights-random-team-${{ matrix.rid }}
          path: arknights-random-team-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unix artifact
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        uses: actions/upload-artifact@v4
        with:
          name: arknights-random-team-${{ matrix.rid }}
          path: arknights-random-team-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download published artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # 提交分类说明写在前面；--generate-notes 仍会把已合并 PR 和 Full Changelog 接在后面。
      - name: Generate commit notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          prev="$(git tag --list 'v*' --sort=-version:refname | awk -v t="$TAG" '$0 != t { print; exit }')"
          if [ -n "$prev" ]; then
            range="$prev..$TAG"
          else
            range="$TAG"
          fi

          {
            echo "## 更新说明"
            echo

            commits="$(git log --no-merges --pretty=tformat:'%s' "$range")"
            if [ -z "$commits" ]; then
              echo "此版本没有新的提交。"
            else
              write_section() {
                local title="$1"
                local pattern="$2"
                local items
                items="$(printf '%s\n' "$commits" | grep -E "$pattern" || true)"
                if [ -n "$items" ]; then
                  echo "### $title"
                  echo
                  printf '%s\n' "$items" | sed -E 's/^[a-z]+(\([^)]+\))?(!)?:[[:space:]]*//' | sed 's/^/- /'
                  echo
                fi
              }

              write_section "新功能" '^feat(\(|:|!)'
              write_section "问题修复" '^fix(\(|:|!)'
              write_section "性能" '^perf(\(|:|!)'
              write_section "重构" '^refactor(\(|:|!)'
              write_section "界面样式" '^style(\(|:|!)'
              write_section "文档" '^docs(\(|:|!)'
              write_section "测试" '^test(\(|:|!)'
              write_section "构建与 CI" '^(build|ci|chore)(\(|:|!)'

              others="$(printf '%s\n' "$commits" | grep -Ev '^(feat|fix|perf|refactor|style|docs|test|build|ci|chore)(\(|:|!)' || true)"
              if [ -n "$others" ]; then
                echo "### 其他"
                echo
                printf '%s\n' "$others" | sed 's/^/- /'
                echo
              fi
            fi
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/*
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
          --generate-notes
          --verify-tag

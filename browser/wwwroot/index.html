<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>明日方舟随机阵容 · Web 版</title>
    <meta name="description" content="明日方舟随机阵容生成器 Web 版：从已勾选干员中随机组队，支持稀有度、职业与指定干员策略。" />
    <link rel="icon" href="icon-256.png" />
    <link rel="stylesheet" href="app.css" />
    <style>
        #app-loading {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; background: #101418; color: #A5B2BF;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            transition: opacity .35s ease;
        }
        #app-loading.hidden { opacity: 0; pointer-events: none; }
        #app-loading .mark {
            width: 56px; height: 56px; border: 1px solid #65E6C4; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; color: #65E6C4;
        }
        #app-loading .title { font-size: 15px; color: #EDF4FA; }
        #app-loading .hint { font-size: 12px; max-width: 280px; text-align: center; line-height: 1.5; }
        #app-loading .bar { width: 180px; height: 3px; background: #24303A; border-radius: 2px; overflow: hidden; }
        #app-loading .bar i { display: block; width: 40%; height: 100%; background: #65E6C4; border-radius: 2px;
            animation: slide 1.1s ease-in-out infinite; }
        #app-loading.error .bar { display: none; }
        #app-loading-retry {
            display: none;
            min-height: 40px; padding: 0 16px;
            border: 1px solid #65E6C4; border-radius: 6px;
            background: #65E6C4; color: #09251F;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        #app-loading.error #app-loading-retry { display: inline-flex; align-items: center; }
        @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    </style>
</head>
<body>
    <div id="app-loading">
        <div class="mark">RT</div>
        <div class="title">明日方舟随机阵容 · Web 版</div>
        <div class="bar"><i></i></div>
        <div id="app-loading-hint" class="hint">正在准备运行时，请稍候…</div>
        <button id="app-loading-retry" type="button">重试</button>
    </div>

    <div id="out"></div>

    <script type="module" src="main.js"></script>
    <script>
        addEventListener("DOMContentLoaded", () => {
            const retry = document.getElementById("app-loading-retry");
            retry?.addEventListener("click", () => location.reload());

            const observer = new MutationObserver(() => {
                const host = document.getElementById("out");
                if (host && host.children.length > 0) {
                    document.getElementById("app-loading")?.classList.add("hidden");
                    observer.disconnect();
                }
            });
            observer.observe(document.getElementById("out"), { childList: true });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>明日方舟随机阵容 · Web 版</title>
    <meta name="description" content="明日方舟随机阵容生成器 Web 版：从已勾选干员中随机组队，支持稀有度、职业与指定干员策略。" />
    <link rel="icon" href="icon-256.png" />
    <link rel="stylesheet" href="app.css" />
    <style>
        #app-loading {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; background: #101418; color: #A5B2BF;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            transition: opacity .35s ease;
        }
        #app-loading.hidden { opacity: 0; pointer-events: none; }
        #app-loading .mark {
            width: 56px; height: 56px; border: 1px solid #65E6C4; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; color: #65E6C4;
        }
        #app-loading .title { font-size: 15px; color: #EDF4FA; }
        #app-loading .hint { font-size: 12px; max-width: 280px; text-align: center; line-height: 1.5; }
        #app-loading .bar { width: 180px; height: 3px; background: #24303A; border-radius: 2px; overflow: hidden; }
        #app-loading .bar i { display: block; width: 40%; height: 100%; background: #65E6C4; border-radius: 2px;
            animation: slide 1.1s ease-in-out infinite; }
        #app-loading.error .bar { display: none; }
        #app-loading-retry {
            display: none;
            min-height: 40px; padding: 0 16px;
            border: 1px solid #65E6C4; border-radius: 6px;
            background: #65E6C4; color: #09251F;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        #app-loading.error #app-loading-retry { display: inline-flex; align-items: center; }
        @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    </style>
</head>
<body>
    <div id="app-loading">
        <div class="mark">RT</div>
        <div class="title">明日方舟随机阵容</div>
        <div class="hint" style="letter-spacing:0.12em;color:#65E6C4;font-family:Consolas,monospace;font-size:11px;">OP.TERMINAL · WEB</div>
        <div class="bar"><i></i></div>
        <div id="app-loading-hint" class="hint">正在准备运行时，请稍候…</div>
        <button id="app-loading-retry" type="button">重试</button>
    </div>

    <div id="out"></div>

    <!--
        启动兜底必须放在入口模块之前：
        入口脚本本身或它的依赖（_framework/dotnet.js）下载/解析失败时，
        模块内部的 try/catch 根本不会执行，只有这里的监听能给出错误出口。
    -->
    <script>
        (() => {
            const overlay = () => document.getElementById("app-loading");
            const hint = () => document.getElementById("app-loading-hint");
            let settled = false;

            globalThis.arknightsStartupError = (message) => {
                settled = true;
                if (!overlay() || !hint()) {
                    console.error(message);
                    return;
                }
                overlay().classList.remove("hidden");
                overlay().classList.add("error");
                hint().textContent = message;
            };

            globalThis.arknightsStartupReady = () => {
                settled = true;
                clearTimeout(timer);
                requestAnimationFrame(() => overlay()?.classList.add("hidden"));
            };

            // 不猜进度，只说明「比预期久」；应用随后就绪时遮罩照样会被撤掉。
            const timer = setTimeout(() => {
                if (!settled)
                    globalThis.arknightsStartupError("启动时间超出预期。可以继续等待，或点「重试」重新加载。");
            }, 45000);

            // 资源加载失败（含入口模块与运行时脚本）不会走进模块内的 catch。
            addEventListener("error", (event) => {
                if (settled)
                    return;

                const target = event.target;
                if (target && target.tagName === "SCRIPT")
                    globalThis.arknightsStartupError("启动脚本加载失败，请检查网络后点「重试」。");
            }, true);

            addEventListener("unhandledrejection", () => {
                if (!settled)
                    globalThis.arknightsStartupError("启动过程中出现未处理的错误，请点「重试」重新加载。");
            });

            document.getElementById("app-loading-retry")?.addEventListener("click", () => location.reload());
        })();
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>

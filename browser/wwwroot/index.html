<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>明日方舟随机阵容 · Web 版</title>
    <meta name="description" content="明日方舟随机阵容生成器 Web 版：从已勾选干员中随机组队，支持稀有度、职业与指定干员策略。" />
    <link rel="icon" href="icon-256.png" />
    <link rel="stylesheet" href="app.css" />
    <style>
        /* 首屏加载遮罩：WASM 运行时下载期间避免白屏 */
        #app-loading {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; background: #0B1118; color: #94A7B9;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            transition: opacity .35s ease;
        }
        #app-loading.hidden { opacity: 0; pointer-events: none; }
        #app-loading .mark {
            position: relative;
            width: 72px; height: 72px; border: 1.5px solid #65E6C4; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 22px; color: #65E6C4; letter-spacing: 1px;
            box-shadow: 0 0 24px rgba(101, 230, 196, 0.25);
        }
        #app-loading .mark::before,
        #app-loading .mark::after {
            content: ""; position: absolute; width: 12px; height: 12px;
            border: 1.5px solid #F3C969;
        }
        #app-loading .mark::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
        #app-loading .mark::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
        #app-loading .title { font-size: 15px; color: #EDF4FA; letter-spacing: .5px; }
        #app-loading .hint { font-size: 12px; max-width: 280px; text-align: center; line-height: 1.5; }
        #app-loading .status { font-size: 11px; color: #65E6C4; min-height: 16px; }
        #app-loading .bar { width: 220px; height: 4px; background: #1E2E3C; border-radius: 2px; overflow: hidden; }
        #app-loading .bar i {
            display: block; width: 40%; height: 100%; background: #65E6C4; border-radius: 2px;
            animation: slide 1.1s ease-in-out infinite;
        }
        #app-loading.has-progress .bar i {
            animation: none;
            width: 0%;
            transition: width .18s ease;
        }
        @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    </style>
</head>
<body>
    <div id="app-loading">
        <div class="mark">RT</div>
        <div class="title">明日方舟随机阵容 · Web 版</div>
        <div class="bar"><i id="app-loading-fill"></i></div>
        <div id="app-loading-status" class="status">正在准备运行时…</div>
        <div class="hint">首次加载包含 .NET 运行时与中文字体，可能需要一些时间。干员名单不会保存在浏览器里。</div>
    </div>

    <div id="out"></div>

    <script type="module" src="main.js"></script>
    <script>
        // 应用挂载后移除加载遮罩
        addEventListener("DOMContentLoaded", () => {
            const observer = new MutationObserver(() => {
                const host = document.getElementById("out");
                if (host && host.children.length > 0) {
                    document.getElementById("app-loading")?.classList.add("hidden");
                    observer.disconnect();
                }
            });
            observer.observe(document.getElementById("out"), { childList: true });
        });
    </script>
</body>
</html>
